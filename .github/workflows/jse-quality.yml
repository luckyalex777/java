name: JSE Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java quality and verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify
        run: ./mvnw -B -ntp clean verify
